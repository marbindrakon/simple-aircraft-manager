name: Run tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-desktop.txt
            requirements-build.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt -r requirements-desktop.txt

      - name: License gate
        run: |
          pip install -r requirements-build.txt
          # jwcrypto (LGPL-3.0-or-later) is a transitive dep of
          # django-oauth-toolkit, used only by the server-side MCP/OAuth
          # stack. settings_desktop strips oauth2_provider + mcp_server, and
          # the PyInstaller specs don't collect them, so jwcrypto never ships
          # in the desktop distributable this gate protects.
          pip-licenses --format=csv \
            --ignore-packages jwcrypto \
            --fail-on="GPL;LGPL;AGPL;SSPL;BUSL;CDDL;EPL"

      - name: Run tests
        run: python -m pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
