name: Run tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-desktop.txt
            requirements-build.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt -r requirements-desktop.txt

      - name: License gate
        run: |
          pip install -r requirements-build.txt
          # jwcrypto (LGPL-3.0-or-later) is a transitive dep of
          # django-oauth-toolkit, used only by the server-side MCP/OAuth
          # stack. settings_desktop strips oauth2_provider + mcp_server, and
          # the PyInstaller specs don't collect them, so jwcrypto never ships
          # in the desktop distributable this gate protects.
          pip-licenses --format=csv \
            --ignore-packages jwcrypto \
            --fail-on="GPL;LGPL;AGPL;SSPL;BUSL;CDDL;EPL"

      - name: Run tests
        run: python -m pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: htmlcov/
